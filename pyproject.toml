[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-interview-kit"
version = "0.1.0"
description = "Python CLIs whose prompts are declared once and answered at the terminal, by flags, or by an AI assistant."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Northbridge Capital" }]
keywords = ["cli", "argparse", "interactive", "prompts", "questionary", "rich", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
dependencies = [
  "prompt-toolkit>=3.0.36",
  "pydantic>=2.7",
  "questionary>=2.0.1",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/Northbridge-Capital/cli-interview-kit"
Source = "https://github.com/Northbridge-Capital/cli-interview-kit"
Issues = "https://github.com/Northbridge-Capital/cli-interview-kit/issues"
Changelog = "https://github.com/Northbridge-Capital/cli-interview-kit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "ruff>=0.14",
  "basedpyright>=1.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cli_interview_kit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "CHANGELOG.md", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "SIM", "PT", "RUF", "C4", "PIE"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = ["error"]
testpaths = ["tests"]
pythonpath = ["examples"]

[tool.coverage.run]
source = ["src/cli_interview_kit"]
branch = true

[tool.basedpyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "standard"
strict = ["src"]
reportMissingTypeStubs = false
extraPaths = ["examples", "tests"]
