version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a release age a week before adopting it (security updates are exempt)
    groups:
      actions:
        patterns: ["*"]

  # The runtime dependencies (pydantic, questionary, prompt-toolkit, rich) get their own PRs and
  # are never grouped: a new release of any of them can change how prompts or output behave.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a release age a week before adopting it (security updates are exempt)
    groups:
      dev-tools:
        dependency-type: development
